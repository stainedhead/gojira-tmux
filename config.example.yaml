# gojira-tmux configuration
# Copy this file to config.yaml and update with your values.

atlassian:
  url: "https://your-company.atlassian.net"
  email: "your-email@company.com"
  custom_fields:  # optional
    sprint: "customfield_10020"
    epic: "customfield_10014"
    # story_points: "customfield_10028"

projects:
  - key: "PROJ"
    name: "My Project"
  - key: "TEAM"
    name: "Team Project"

team:
  - name: "John Anderson"
    email: "john.anderson@company.com"
    alias: "JohnA"  # optional: short alias for quick filtering
  - name: "John Flanagan"
    email: "john.flanagan@company.com"
    alias: "JohnF"
  - name: "Jane Smith"
    email: "jane.smith@company.com"
    # alias is optional - members without aliases are matched by name

# status_filters defines named filter groups that appear in the Status dropdown
# above individual Jira status names.  Each group expands to a multi-status JQL
# condition when selected.
#
# If this section is omitted, the following built-in defaults are used:
#
# status_filters:
#   - name: "-Open-"
#     statuses:
#       - "Ready for Work"
#       - "In Progress"
#       - "On Hold"
#       - "Escalated"
#   - name: "-Active-"
#     statuses:
#       - "In Progress"
#       - "Escalated"
#       - "Testing in Progress"
#
# Example: replace the defaults with project-specific groups
status_filters:
  - name: "-Open-"
    statuses:
      - "Ready for Work"
      - "In Progress"
      - "On Hold"
      - "Escalated"
  - name: "-Active-"
    statuses:
      - "In Progress"
      - "Escalated"
      - "Testing in Progress"
  # Add your own groups, e.g.:
  # - name: "-My Work-"
  #   statuses:
  #     - "In Progress"
  #     - "In Review"
